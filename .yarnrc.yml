enableTelemetry: true

nodeLinker: node-modules

logFilters:
  # @types/react is an optional peer of Storybook's docs/React-interop
  # packages; this project has no React, so it's never going to be satisfied.
  - code: YN0002
    pattern: "*@types/react*"
    level: discard

packageExtensions:
  # Storybook's manager UI is React-based regardless of story framework, and
  # react is already pulled in transitively (via @storybook/addon-docs) — this
  # package just doesn't mark its own react peer as optional.
  "@storybook/icons@*":
    peerDependenciesMeta:
      react:
        optional: true
  # Root's typescript devDependency satisfies this in range; it's just not
  # wired to this nested instance.
  "@typescript-eslint/utils@*":
    peerDependenciesMeta:
      typescript:
        optional: true
  # Only one copy of @sveltejs/vite-plugin-svelte exists in the tree; this is
  # a virtual-instance boundary quirk, not a real missing/duplicate package.
  "@storybook/svelte-vite@*":
    peerDependenciesMeta:
      "@sveltejs/vite-plugin-svelte":
        optional: true
